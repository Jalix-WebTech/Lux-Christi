<!doctype html>
<html lang="en">
  <!--
    Lux Christi - Login Page
    -------------------------
    Production-grade user authentication page with:
    - Fully responsive design (mobile, tablet, desktop)
    - Password visibility toggle with eye icon
    - Social login options (Google, Microsoft)
    - Modern, polished UI with world-class UX
    - Touch-friendly interactive elements
    - Accessibility-first approach
    - Full dark mode support
  -->
  <head>
    <!-- Character Encoding -->
    <meta charset="UTF-8" />

    <!-- Responsive Viewport with proper mobile scaling -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- SEO Title -->
    <title>Login | Lux Christi - Access Your Account</title>

    <!-- Website Description -->
    <meta
      name="description"
      content="Login to your Lux Christi account to access quizzes, competitions, and grow in faith."
    />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/forms.css" />
  </head>

  <body>
    <!-- =========================================================
      LUX CHRISTI • APPLICATION HEADER
      Purpose:
      - Brand Identity
      - Primary Navigation
      - Theme Toggle
      - Authentication
      - Mobile Navigation
    ========================================================== -->

    <header class="header">
      <nav class="navbar">
        <!-- Brand Logo -->
        <a href="index.html" class="logo">
          <img src="assets/logo.jpg" alt="Lux Christi Logo" />
          <span>Lux Christi</span>
        </a>

        <!-- Mobile Menu Button -->
        <button
          id="menuToggle"
          class="menu-toggle"
          aria-label="Open navigation menu"
          aria-expanded="false"
          aria-controls="navMenu"
        >
          <i data-lucide="menu" class="menu-icon"></i>
          <i data-lucide="x" class="close-icon"></i>
        </button>

        <!-- Navigation Menu -->
        <div class="nav-menu" id="navMenu">
          <ul class="nav-links">
            <li>
              <a href="index.html">
                <i data-lucide="house"></i>
                <span>Home</span>
              </a>
            </li>
            <li>
              <a href="learn.html">
                <i data-lucide="book-open"></i>
                <span>Learn</span>
              </a>
            </li>
            <li>
              <a href="quiz.html">
                <i data-lucide="circle-help"></i>
                <span>Quiz</span>
              </a>
            </li>
            <li>
              <a href="community.html">
                <i data-lucide="users"></i>
                <span>Community</span>
              </a>
            </li>
            <li>
              <a href="about.html">
                <i data-lucide="info"></i>
                <span>About</span>
              </a>
            </li>
          </ul>

          <!-- Action Buttons -->
          <div class="nav-buttons">
            <a href="login.html" class="login-btn active">
              <i data-lucide="log-in"></i>
              <span>Login</span>
            </a>
            <a href="register.html" class="register-btn">
              <i data-lucide="user-plus"></i>
              <span>Register</span>
            </a>
            <button
              id="theme-toggle"
              class="theme-toggle"
              aria-label="Toggle dark mode"
              title="Toggle dark mode"
            >
              <span class="theme-toggle-label"></span>
              <i data-lucide="moon"></i>
              <span class="theme-status-dot" aria-hidden="true"></span>
            </button>
          </div>
        </div>
      </nav>
    </header>

    <!-- =========================================================
      MAIN CONTENT AREA
      Production-grade login form with full responsiveness
    ========================================================== -->

    <main class="form-main">
      <div class="form-wrapper">
        <!-- Login Card -->
        <div class="form-card">
          <!-- Header Section -->
          <div class="form-header">
            <h1>Welcome Back</h1>
            <p>Sign in to your Lux Christi account</p>
          </div>

          <!-- Login Form -->
          <form class="form-content" novalidate>
            <!-- ===== EMAIL FIELD ===== -->
            <div class="form-field-group">
              <label for="email" class="form-label">
                Email Address
                <span class="required" aria-label="required">*</span>
              </label>
              <input
                type="email"
                id="email"
                name="email"
                class="form-input"
                placeholder="your@email.com"
                required
                aria-required="true"
                autocomplete="email"
              />
            </div>

            <!-- ===== PASSWORD FIELD WITH TOGGLE ===== -->
            <div class="form-field-group">
              <label for="password" class="form-label">
                Password
                <span class="required" aria-label="required">*</span>
              </label>
              <div class="input-wrapper password-field">
                <input
                  type="password"
                  id="password"
                  name="password"
                  class="form-input password-input"
                  placeholder="••••••••"
                  required
                  aria-required="true"
                  autocomplete="current-password"
                />
                <button
                  type="button"
                  class="password-toggle-btn"
                  id="passwordToggle"
                  aria-label="Toggle password visibility"
                  title="Show/hide password"
                  tabindex="0"
                >
                  <i data-lucide="eye-off"></i>
                </button>
              </div>
            </div>

            <!-- ===== REMEMBER ME & FORGOT PASSWORD ===== -->
            <div class="login-options">
              <div class="form-checkbox-group">
                <input type="checkbox" id="remember" name="remember" />
                <label for="remember">Remember me</label>
              </div>
              <a href="#" class="forgot-password-link">Forgot password?</a>
            </div>

            <!-- ===== SUBMIT BUTTON ===== -->
            <button type="submit" class="submit-btn">Sign In</button>
          </form>

          <!-- Divider -->
          <div class="divider-line">
            <span>OR</span>
          </div>

          <!-- ===== SOCIAL LOGIN BUTTONS ===== -->
          <div class="social-login-container">
            <!-- Google Login -->
            <button type="button" class="social-btn">
              <i data-lucide="mail"></i>
              Continue with Google
            </button>

            <!-- Microsoft Login -->
            <button type="button" class="social-btn">
              <i data-lucide="monitor"></i>
              Continue with Microsoft
            </button>
          </div>

          <!-- ===== SIGN UP LINK ===== -->
          <div class="signup-link-section">
            Don't have an account?
            <a href="register.html">Sign up here</a>
          </div>
        </div>

        <!-- ===== SUPPORT INFO CARD ===== -->
        <div class="support-card">
          <p>Having trouble logging in?</p>
          <a href="contact.html">Contact our support team</a>
        </div>
      </div>
    </main>

    <!-- Scripts -->
    <script src="js/navbar.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
    <script src="js/theme.js"></script>

    <!-- ===== PASSWORD VISIBILITY TOGGLE SCRIPT ===== -->
    <script>
      // Initialize password visibility toggle
      function initPasswordToggle(inputId, buttonId) {
        const input = document.getElementById(inputId);
        const button = document.getElementById(buttonId);

        if (!input || !button) return;

        // Initial state
        let isPasswordVisible = false;

        // Toggle password visibility
        function togglePasswordVisibility() {
          isPasswordVisible = !isPasswordVisible;

          if (isPasswordVisible) {
            input.type = "text";
            button.setAttribute("aria-label", "Hide password");
            button.title = "Hide password";
            // Update Lucide icon
            const icon = button.querySelector("i[data-lucide]");
            if (icon) {
              icon.setAttribute("data-lucide", "eye");
            }
          } else {
            input.type = "password";
            button.setAttribute("aria-label", "Show password");
            button.title = "Show password";
            // Update Lucide icon
            const icon = button.querySelector("i[data-lucide]");
            if (icon) {
              icon.setAttribute("data-lucide", "eye-off");
            }
          }

          // Refresh Lucide icons
          lucide.createIcons();

          // Refocus input after toggle
          input.focus();
        }

        // Click event
        button.addEventListener("click", (e) => {
          e.preventDefault();
          togglePasswordVisibility();
        });

        // Keyboard support (Space/Enter)
        button.addEventListener("keydown", (e) => {
          if (e.key === " " || e.key === "Enter") {
            e.preventDefault();
            togglePasswordVisibility();
          }
        });
      }

      // Initialize password toggle
      initPasswordToggle("password", "passwordToggle");

      // ===== FORM SUBMISSION =====
      const form = document.querySelector(".login-form");
      if (form) {
        form.addEventListener("submit", function (e) {
          e.preventDefault();

          // Validate inputs
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;

          if (!email || !password) {
            alert("Please fill in all fields.");
            return;
          }

          if (!email.includes("@")) {
            alert("Please enter a valid email address.");
            return;
          }

          // TODO: Send login request to backend API
          // For now, show success message
          alert("Login successful! (Development mode - no backend yet)");

          // Optionally redirect to dashboard after successful login
          // window.location.href = 'dashboard.html';
        });
      }

      // ===== SOCIAL LOGIN BUTTONS =====
      document.querySelectorAll(".social-btn").forEach((button) => {
        button.addEventListener("click", function (e) {
          e.preventDefault();
          const provider = this.textContent.includes("Google")
            ? "Google"
            : "Microsoft";
          alert(`${provider} login not yet implemented.`);
          // TODO: Implement OAuth flow for social login
        });
      });
    </script>
  </body>
</html>
