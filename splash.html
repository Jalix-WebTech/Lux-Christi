<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Lux Christi</title>

    <!-- Splash Screen CSS -->
    <link rel="stylesheet" href="css/splash.css" />
  </head>

  <body>
    <!-- Splash Screen Container -->
    <!-- This page is displayed before the main homepage. It gives a branded loading experience. -->
    <main class="splash">
      <!-- App Logo -->
      <img src="assets/logo.jpg" alt="Lux Christi Logo" class="logo" />

      <!-- App Name -->
      <h1>Lux Christi</h1>

      <!-- Short Description -->
      <p>Learn • Grow • Evangelize</p>

      <!-- Loading Animation -->
      <div class="loader"></div>
    </main>

    <!-- The script below keeps the splash visible for 5 seconds, then sends the user to the homepage. -->
    <script src="js/splash.js"></script>
  </body>
</html>
